name: Experimental AC-3 Tizen build

on:
  push:
    branches:
      - ac3-audio-passthrough
    paths:
      - 'CMakeLists.txt'
      - 'res/**'
      - 'Dockerfile'
      - 'moonlight-common-c/**'
      - 'wasm/**'
      - '.github/workflows/build-ac3-passthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Tizen WGT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate startup JavaScript and Spanish locale
        shell: bash
        run: |
          set -euo pipefail
          node --check wasm/platform/index.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          en = json.loads(Path("wasm/static/locales/en-US.json").read_text(encoding="utf-8"))
          es = json.loads(Path("wasm/static/locales/es-ES.json").read_text(encoding="utf-8"))
          missing = sorted(set(en) - set(es))
          extra = sorted(set(es) - set(en))
          if missing or extra:
              raise SystemExit(
                  "Spanish locale keys differ from en-US.json. "
                  f"Missing={missing!r}; extra={extra!r}"
              )
          required = {
              "Optical audio output",
              "Enable optical output",
              "- When enabled, Moonlight negotiates AC-3 or E-AC-3 with the host instead of default Opus when available. Optical mode uses EMSS and limits channel selection to Stereo or 5.1 because the current host encoder does not support 7.1 for these formats.",
              "Quit host app on disconnect",
              "- When enabled, Moonlight attempts to quit the app running on the host after a normal disconnection. Unexpected connection failures do not trigger this option.",
              "Automatically quit the running app on the host",
              "Could not automatically quit the host app."
          }
          for locale_name, locale in (("en-US", en), ("es-ES", es)):
              missing_required = sorted(required - set(locale))
              if missing_required:
                  raise SystemExit(f"{locale_name} is missing optical-output strings: {missing_required!r}")
          pt = json.loads(Path("wasm/static/locales/pt-BR.json").read_text(encoding="utf-8"))
          missing_pt = sorted(required - set(pt))
          if missing_pt:
              raise SystemExit(f"pt-BR is missing optical-output strings: {missing_pt!r}")
          print(f"Spanish locale key set matches en-US.json ({len(en)} keys); optical-output strings exist in all locales.")
          PY

      - name: Build experimental client
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-ac3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract WGT package
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-ac3:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-AC3-Experimental.wgt"
          test -s "$RUNNER_TEMP/Moonlight-AC3-Experimental.wgt"

      - name: Upload experimental WGT
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-AC3-Experimental
          path: ${{ runner.temp }}/Moonlight-AC3-Experimental.wgt
          if-no-files-found: error
          retention-days: 14
